title: Sakura
subtitle: MOMENTS
description: Sakura の個人サイト。
author: Sakura
language:
  - ja
  - zh-CN
timezone: Asia/Tokyo
url: https://SAKURA-love999.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false
source_dir: source
public_dir: public
skip_render:
  - 'css/**'
  - 'js/**'
  - 'fonts/**'
  - 'imgs/**'
  - 'music/**'
tag_dir: tags
archive_dir: archives
category_dir: categories
new_post_name: :year-:month-:day-:title.md
default_layout: post
titlecase: false
render_drafts: false
post_asset_folder: false
relative_link: false
future: false
highlight:
  enable: true
  line_number: false
prismjs:
  enable: false
per_page: 10
pagination_dir: page
index_generator:
  path: ''
  per_page: 10
  order_by: -date
archive_generator:
  per_page: 10
  yearly: true
  monthly: true
  daily: false
category_generator:
  per_page: 10
tag_generator:
  per_page: 10
theme: sakura
deploy:
  type: sakura-git
  repo: https://github.com/SAKURA-love999/SAKURA-love999.github.io.git
  branch: master
